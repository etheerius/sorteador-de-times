<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sorteador de Times</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 15px;
    }
    .card-header {
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">⚽ Sorteador de Times</h4>
      </div>
      <div class="card-body">
        <label for="jogadoresInput" class="form-label">Digite os nomes dos jogadores (um por linha):</label>
        <textarea id="jogadoresInput" class="form-control mb-3" rows="8" placeholder="Ex: João&#10;Pedro&#10;Gabriel&#10;Washington..."></textarea>
        <button onclick="sortearTimes()" class="btn btn-success w-100">🎲 Sortear Times</button>
      </div>
    </div>
    <div id="resultado" class="row g-4"></div>
  </div>

  <script>
    const jogadoresPorTime = 5;

    function sortearTimes() {
      const input = document.getElementById("jogadoresInput").value;
      const nomesOriginais = input.split("\n").map(j => j.trim()).filter(j => j !== "");

      if (nomesOriginais.length < jogadoresPorTime) {
        alert(`Digite pelo menos ${jogadoresPorTime} jogadores para formar um time.`);
        return;
      }

      const nomesEmbaralhados = embaralharArray([...nomesOriginais]);
      const totalTimes = Math.floor(nomesEmbaralhados.length / jogadoresPorTime);
      const times = [];

      for (let i = 0; i < totalTimes; i++) {
        const inicio = i * jogadoresPorTime;
        const fim = inicio + jogadoresPorTime;
        times.push(nomesEmbaralhados.slice(inicio, fim));
      }

      const usados = times.flat();
      const reservas = nomesEmbaralhados.filter(nome => !usados.includes(nome));

      const resultado = document.getElementById("resultado");
      resultado.innerHTML = "";

      times.forEach((time, i) => {
        resultado.appendChild(criarTabela(`Time ${i + 1}`, time, "info"));
      });

      if (reservas.length > 0) {
        resultado.appendChild(criarTabela("Reservas", reservas, "secondary"));
      }

      if (times.length === 0) {
        resultado.innerHTML = "<p class='text-center'>Nenhum time pôde ser formado.</p>";
      }
    }

    function criarTabela(titulo, jogadores, cor) {
      const col = document.createElement("div");
      col.className = "col-sm-12 col-md-6 col-lg-4";

      const card = document.createElement("div");
      card.className = `card border-${cor} shadow-sm`;

      const header = document.createElement("div");
      header.className = `card-header bg-${cor} text-white text-center`;
      header.innerHTML = `<h5 class="mb-0">${titulo}</h5>`;

      const table = document.createElement("table");
      table.className = "table mb-0";

      const tbody = document.createElement("tbody");

      jogadores.forEach((jogador, indice) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.scope = "row";
        th.textContent = indice + 1;
        const td = document.createElement("td");
        td.textContent = jogador;
        tr.appendChild(th);
        tr.appendChild(td);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);

      card.appendChild(header);
      card.appendChild(table);
      col.appendChild(card);

      return col;
    }

    function embaralharArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
  </script>
</body>
</html>
